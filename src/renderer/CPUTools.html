<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>硬件信息 - 图吧工具箱</title>
    <link rel="stylesheet" href="assets/CPUTools.css" />
    <style>
      /* ============ iframe 内嵌页面样式 ============ */
      /* 外层 index.html 已提供标题栏和导航栏，本页只渲染内容区 */
      body {
        background: #000000;
        display: block !important;
        height: 100vh;
        width: 100vw;
        justify-content: normal !important;
        align-items: normal !important;
        overflow: hidden;
      }

      /* 内容区填满 iframe */
      .frame-page {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 15px;
        background: #0a0a0a;
        overflow: hidden;
      }

      .frame-page .tools-section {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- 内容区（无标题栏/导航栏，由外层 index.html 的 iframe 承载） -->
    <div class="frame-page">
      <!-- 提示栏 -->
      <div class="tip-bar">提示：单击选择工具可查看工具说明，双击可启动工具。</div>

      <!-- 工具网格区域 -->
      <div class="tools-section">
        <div class="section-header">
          <span class="section-title" id="category-title">硬件信息</span>
          <span class="tool-count" id="tool-count">共 0 个工具</span>
        </div>
        <div class="tools-grid" id="tools-grid">
          <!-- 工具图标由 JS 动态渲染 -->
        </div>
      </div>

      <!-- 底部状态栏 -->
      <div class="status-bar">
        <span>Version: 2022.01</span>
        <span id="status-text">就绪</span>
      </div>
    </div>

    <script type="module" src="./src/CPUTools.ts"></script>
  </body>
</html>
