<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>破晓工具箱</title>
    <link rel="stylesheet" href="assets/main.css" />
    <style>
      /* ============ 主框架（导航栏 + iframe 内容区）专用样式 ============ */

      /* 内容区改为 iframe 承载 */
      .content-area {
        padding: 0;
        gap: 0;
        overflow: hidden;
      }

      /* iframe 容器：填满内容区 */
      .frame-container {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        position: relative;
        background: transparent;
      }

      .frame-container iframe {
        display: block;
        flex: 1;
        min-height: 0;
        width: 100%;
        border: none;
        background: transparent;
      }

      /* 淡入淡出动画 */
      .frame-container iframe.fade-out {
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      .frame-container iframe.fade-in {
        opacity: 1;
        transition: opacity 0.25s ease;
      }
    </style>
  </head>
  <body>
    <!-- 整体容器 -->
    <div class="app-container">
      <!-- 1. 顶部标题栏 -->
      <div class="title-bar">
        <div class="window-title">破晓工具箱</div>
        <div class="window-controls">
          <button class="control-btn btn-close" id="window-close-btn">
            <img src="./assets/icons/close.svg" class="icon-svg icon-close" alt="关闭" />
          </button>
        </div>
      </div>

      <!-- 2. 主体内容 -->
      <div class="main-body">
        <!-- 左侧导航栏 -->
        <div class="sidebar">
          <div class="nav-indicator"></div>

          <div class="nav-item" data-page="NetEase.html">
            网易云音乐
          </div>
          <div class="nav-item" data-page="cryptoPage.html">
            文本加解密
          </div>

          <div class="nav-group" data-group="toolbox">
            <div class="nav-item nav-group-trigger" data-group-trigger="toolbox">
              图吧工具箱
            </div>
            <div class="nav-submenu">
              <div class="nav-item nav-subitem" data-page="CPUTools.html">
                CPU工具
              </div>
            </div>
          </div>
        </div>

        <!-- 右侧内容区：iframe 承载各功能页面 -->
        <div class="content-area">
          <div class="frame-container" id="frame-container">
            <!-- iframe 由 index.ts 动态创建，默认加载 NetEase.html -->
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
