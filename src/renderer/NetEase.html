<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网易云音乐 · 破晓工具箱</title>
    <!-- 复用全局样式，保持与其他页面一致 -->
    <link rel="stylesheet" href="assets/main.css" />
    <style>
      /* ============ 网易云音乐页面专用样式 ============ */
      /* 设计语言与 cryptoPage / CPUTools 保持一致：深色主题、圆角面板 */

      /* iframe 内嵌页面：外层 index.html 已提供标题栏和导航栏 */
      body {
        background: transparent;
        display: block !important;
        height: 100vh;
        width: 100vw;
        justify-content: normal !important;
        align-items: normal !important;
        overflow: hidden;
      }

      /* 内容区填满 iframe */
      .frame-page {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 15px;
        background: transparent;
        overflow: hidden;
      }

      /* ===== 通用面板 ===== */
      .panel {
        background: rgba(15, 15, 15, 0.32);
        backdrop-filter: blur(16px) saturate(150%);
        -webkit-backdrop-filter: blur(16px) saturate(150%);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 12px 15px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      .panel-title {
        font-size: 12px;
        font-weight: 500;
        color: #888888;
        white-space: nowrap;
      }

      /* ===== 搜索区域 ===== */
      .search-section {
        flex: 1;
      }

      .search-input {
        flex: 1;
        height: 36px;
        font-size: 13px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        color: #ffffff;
        border-radius: 8px;
        padding: 0 14px;
        outline: none;
        transition: all 0.3s ease;
      }

      .search-input:focus {
        background: #222222;
        border-color: #4a4a4a;
      }

      .search-input::placeholder {
        color: #666666;
        font-size: 13px;
      }

      .search-btn {
        height: 36px;
        font-size: 13px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        color: #ffffff;
        border-radius: 8px;
        padding: 0 18px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .search-btn:hover {
        background: #2a2a2a;
        border-color: #3a3a3a;
      }

      .search-btn img {
        width: 14px;
        height: 14px;
        opacity: 0.8;
      }

      /* ===== 歌曲列表主区域（强制固定高度） ===== */
      .song-list-section {
        height: 420px;
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        overflow: hidden;
        padding: 16px 18px;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 12px;
        border-bottom: 1px solid #242424;
        margin-bottom: 12px;
        flex-shrink: 0;
      }

      .section-title {
        font-weight: 600;
        font-size: 1rem;
        letter-spacing: 0.5px;
        color: #e8e8e8;
      }

      .song-count {
        font-size: 0.8rem;
        background: #1a1a1a;
        padding: 4px 12px;
        border-radius: 40px;
        color: #aaa;
        border: 1px solid #2c2c2c;
      }

      .song-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-right: 4px;
      }

      .song-list::-webkit-scrollbar {
        width: 6px;
      }

      .song-list::-webkit-scrollbar-track {
        background: transparent;
      }

      .song-list::-webkit-scrollbar-thumb {
        background: #2a2a2a;
        border-radius: 3px;
      }

      .song-list::-webkit-scrollbar-thumb:hover {
        background: #3a3a3a;
      }

      .song-item {
        display: grid;
        grid-template-columns: 32px 1fr 1.2fr;
        align-items: center;
        padding: 13px 16px;
        border-radius: 10px;
        background: transparent;
        transition: 0.12s;
        cursor: default;
        border: 1px solid transparent;
      }

      .song-item:hover {
        background: #1a1a1a;
        border-color: #2b2b2b;
      }

      .song-index {
        color: #5e5e5e;
        font-size: 0.85rem;
        font-weight: 400;
        text-align: center;
      }

      .song-name {
        font-weight: 450;
        font-size: 0.95rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #ececec;
      }

      .song-artist {
        color: #8a8a8a;
        font-size: 0.85rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: right;
      }

      .placeholder-item {
        opacity: 0.5;
        justify-content: center;
        color: #5a5a5a;
        pointer-events: none;
        display: flex;
      }

      .placeholder-item .song-name {
        color: #5a5a5a;
      }

      /* ===== Cookie 区域（使用弹性布局填充剩余空间） ===== */
      .cookie-section {
        flex: 1;
        min-height: 56px;
        padding: 8px 15px;
        gap: 10px;
      }

      .cookie-input-field {
        flex: 1;
        height: 34px;
        font-size: 13px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        color: #e0e0e0;
        border-radius: 8px;
        padding: 0 12px;
        outline: none;
        transition: border-color 0.15s;
      }

      .cookie-input-field:focus {
        border-color: #4a4a4a;
        background: #222222;
      }

      .cookie-input-field::placeholder {
        color: #666666;
      }

      .cookie-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
      }

      .solid-btn {
        height: 36px;
        padding: 0 18px;
        font-size: 13px;
        border-radius: 8px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        color: #cccccc;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }

      .solid-btn:hover {
        background: #2a2a2a;
        color: #ffffff;
        border-color: #3a3a3a;
      }

      .solid-btn img {
        width: 14px;
        height: 14px;
        opacity: 0.8;
      }

      .save-btn {
        background: #1d4ed8;
        border-color: #2563eb;
        color: #ffffff;
      }

      .save-btn:hover {
        background: #2563eb;
        color: #ffffff;
      }

      .cookie-status {
        font-size: 11px;
        color: #4CAF50;
        white-space: nowrap;
      }

      .cookie-status.error {
        color: #f44336;
      }

      /* ===== 播放器栏 ===== */
      .player-bar {
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px 20px;
      }

      .player-info {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 150px;
      }

      .player-cover {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        background: #1f1f1f;
        overflow: hidden;
        flex-shrink: 0;
        border: 1px solid #2d2d2d;
      }

      .player-cover-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: #1a1a1a;
      }

      .player-song-detail {
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow: hidden;
      }

      .player-song-name {
        font-weight: 500;
        font-size: 0.9rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #ececec;
      }

      .player-artist-name {
        font-size: 0.75rem;
        color: #8a8a8a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .player-controls {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .player-btn {
        background: transparent;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.1s;
        border: 1px solid transparent;
      }

      .player-btn:hover {
        background: #242424;
        border-color: #353535;
      }

      .player-btn img {
        width: 20px;
        height: 20px;
        filter: invert(0.8);
        transition: 0.1s;
      }

      .play-btn img {
        width: 26px;
        height: 26px;
      }

      .player-progress {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 2;
        min-width: 140px;
      }

      .progress-time {
        font-size: 0.7rem;
        color: #8a8a8a;
        font-variant-numeric: tabular-nums;
        min-width: 38px;
      }

      .progress-bar {
        flex: 1;
        height: 4px;
        background: #282828;
        border-radius: 10px;
        cursor: pointer;
        position: relative;
        transition: 0.1s;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #b0b0b0, #e0e0e0);
        border-radius: 10px;
        transition: width 0.1s ease;
      }

      .player-volume {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 100px;
      }

      .volume-slider {
        -webkit-appearance: none;
        appearance: none;
        background: #222;
        height: 3px;
        border-radius: 10px;
        width: 72px;
        outline: none;
        transition: 0.1s;
      }

      .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #d0d0d0;
        cursor: pointer;
        border: 1px solid #3a3a3a;
      }

      .volume-slider::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #d0d0d0;
        border: 1px solid #3a3a3a;
      }

      .volume-btn img {
        width: 18px;
        height: 18px;
      }

      /* ===== 响应式 ===== */
      @media (max-width: 820px) {
        .frame-page {
          padding: 12px;
          gap: 10px;
        }
        .search-section,
        .cookie-section {
          flex-wrap: wrap;
        }
        .player-bar {
          justify-content: center;
        }
        .player-progress {
          order: 10;
          flex-basis: 100%;
        }
      }
    </style>
  </head>
  <body>
    <!-- 内容区（无标题栏/导航栏，由外层 index.html 的 iframe 承载） -->
    <div class="frame-page">

      <!-- 1. 搜索区域 -->
      <div class="panel search-section">
        <input type="text" id="search-music" class="search-input" placeholder="搜索网易云音乐 · 歌曲 / 歌手" />
        <button class="search-btn" id="search_music_btn">搜索</button>
      </div>

      <!-- 2. 歌曲列表主区域 -->
      <div class="panel song-list-section">
        <div class="section-header">
          <span class="section-title">♫ 播放列表</span>
          <span class="song-count" id="songCount">共 0 首</span>
        </div>
        <div class="song-list" id="songListContainer">
          <div class="song-item placeholder-item">
            <span class="song-index">#</span>
            <span class="song-name">搜索歌曲开始聆听</span>
            <span class="song-artist">-</span>
          </div>
        </div>
      </div>

      <!-- 3. Cookie 设置 + 操作按钮 -->
      <div class="panel cookie-section">
        <span class="panel-title">Cookie (Music_U)</span>
        <input type="text" id="cookie-input" class="cookie-input-field" placeholder="粘贴 MUSIC_U Cookie 值..." />
        <div class="cookie-actions">
          <button class="solid-btn save-btn" id="cookie-save-btn">保存</button>
          <button class="solid-btn" id="share-music-btn">分享</button>
          <span class="cookie-status" id="cookie-status"></span>
        </div>
      </div>

      <!-- 4. 播放器栏 -->
      <div class="panel player-bar">
        <div class="player-info">
          <div class="player-cover">
            <img id="player-cover-img" class="player-cover-img" src="" alt="封面" />
          </div>
          <div class="player-song-detail">
            <div class="player-song-name" id="player-song-name">未在播放</div>
            <div class="player-artist-name" id="player-artist-name">-</div>
          </div>
        </div>

        <div class="player-controls">
          <button class="player-btn prev-btn" title="上一首">
            <img src="./assets/icons/prev.svg" alt="上一首" />
          </button>
          <button class="player-btn play-btn" title="播放/暂停" id="play-toggle-btn">
            <img src="./assets/icons/play.svg" id="play-icon" alt="播放" />
          </button>
          <button class="player-btn next-btn" title="下一首">
            <img src="./assets/icons/next.svg" alt="下一首" />
          </button>
        </div>

        <div class="player-progress">
          <span class="progress-time current-time" id="current-time">00:00</span>
          <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
          </div>
          <span class="progress-time total-time" id="total-time">00:00</span>
        </div>

        <div class="player-volume">
          <button class="player-btn volume-btn" id="volume-btn" title="静音">
            <img src="./assets/icons/volume.svg" id="volume-icon" alt="音量" />
          </button>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80" title="音量" />
        </div>
      </div>
    </div>

    <audio id="music-player" preload="metadata"></audio>
    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
