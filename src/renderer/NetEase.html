<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网易云音乐 · 破晓工具箱</title>
    <!-- 复用全局样式，保持与其他页面一致 -->
    <link rel="stylesheet" href="assets/main.css" />
    <link rel="stylesheet" href="assets/NetEase.css" />
  </head>
  <body>
    <!-- 内容区（无标题栏/导航栏，由外层 index.html 的 iframe 承载） -->
    <div class="frame-page">

      <!-- 1. 搜索区域 -->
      <div class="panel search-section">
        <input type="text" id="search-music" class="search-input" placeholder="搜索网易云音乐 · 歌曲 / 歌手" />
        <button class="search-btn" id="search_music_btn">搜索</button>
      </div>

      <!-- 2. 歌曲列表主区域 -->
      <div class="panel song-list-section">
        <div class="section-header">
          <span class="section-title">♫ 播放列表</span>
          <span class="song-count" id="songCount">共 0 首</span>
        </div>
        <div class="song-list" id="songListContainer">
          <div class="song-item placeholder-item">
            <span class="song-index">#</span>
            <span class="song-name">搜索歌曲开始聆听</span>
            <span class="song-artist">-</span>
          </div>
        </div>
      </div>

      <!-- 3. Cookie 设置 + 操作按钮 -->
      <div class="panel cookie-section">
        <span class="panel-title">Cookie (Music_U)</span>
        <input type="text" id="cookie-input" class="cookie-input-field" placeholder="粘贴 MUSIC_U Cookie 值..." />
        <div class="cookie-actions">
          <button class="solid-btn save-btn" id="cookie-save-btn">保存</button>
          <button class="solid-btn" id="share-music-btn">分享</button>
          <span class="cookie-status" id="cookie-status"></span>
        </div>
      </div>

      <!-- 4. 播放器栏 -->
      <div class="panel player-bar">
        <div class="player-info">
          <div class="player-cover">
            <img id="player-cover-img" class="player-cover-img" src="" alt="封面" />
          </div>
          <div class="player-song-detail">
            <div class="player-song-name" id="player-song-name">未在播放</div>
            <div class="player-artist-name" id="player-artist-name">-</div>
          </div>
        </div>

        <div class="player-controls">
          <button class="player-btn prev-btn" title="上一首">
            <img src="./assets/icons/prev.svg" alt="上一首" />
          </button>
          <button class="player-btn play-btn" title="播放/暂停" id="play-toggle-btn">
            <img src="./assets/icons/play.svg" id="play-icon" alt="播放" />
          </button>
          <button class="player-btn next-btn" title="下一首">
            <img src="./assets/icons/next.svg" alt="下一首" />
          </button>
        </div>

        <div class="player-progress">
          <span class="progress-time current-time" id="current-time">00:00</span>
          <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
          </div>
          <span class="progress-time total-time" id="total-time">00:00</span>
        </div>

        <div class="player-volume">
          <button class="player-btn volume-btn" id="volume-btn" title="静音">
            <img src="./assets/icons/volume.svg" id="volume-icon" alt="音量" />
          </button>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80" title="音量" />
        </div>
      </div>
    </div>

    <audio id="music-player" preload="metadata"></audio>
    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
